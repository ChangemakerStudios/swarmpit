name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to release (e.g. 1.10)'
        required: true
        type: string

jobs:
  clojure:
    name: Test & Build Clojure
    env:
      DOCKER: "25.0.5"
    runs-on: ubuntu-latest
    steps:
      - name: checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: install java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: install clojure tools
        uses: DeLaGuardo/setup-clojure@9.5
        with:
          lein: latest
      - run: ./init-db.sh
        name: start DB
        working-directory: dev/script
      - run: ./init-influx.sh
        name: start Influx
        working-directory: dev/script
      - run: ./init-agent.sh
        name: start Agent
        working-directory: dev/script
      - run: ./start-dind.sh
        name: start Docker in Docker
        working-directory: dev/script
      # The jar reports this at /version and in the UI. Without it the release
      # artifact calls itself 2.0-SNAPSHOT whatever tag it was cut from.
      # build.yml derives the same number from GitVersion; here the tag is it.
      - name: set project version
        run: sed -i "s/^(defproject swarmpit \".*\"/(defproject swarmpit \"${{ inputs.tag || github.ref_name }}\"/" project.clj
      - run: lein deps
      - run: lein test :all
      - run: lein uberjar
      - name: upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: swarmpit.jar
          path: target/swarmpit.jar

  docker:
    name: Build and push docker
    runs-on: ubuntu-latest
    needs: clojure
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        name: download release jar
        with:
          name: swarmpit.jar
          path: target
      - name: set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v5
          # Both tags from this one build, so :latest is the released image and
          # not merely another build of the same commit. Two tags off one build
          # upload the layers once and write two manifests, which is nothing
          # like the cost of building and pushing the whole thing twice.
          tags: |
            ghcr.io/changemakerstudios/swarmpit:${{ inputs.tag || github.ref_name }}
            ghcr.io/changemakerstudios/swarmpit:latest

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - name: checkout tag
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        name: download release jar
        with:
          name: swarmpit.jar
          path: target
      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/swarmpit.jar
          generate_release_notes: true
