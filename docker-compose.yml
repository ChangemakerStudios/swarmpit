services:
  app:
    image: ghcr.io/changemakerstudios/swarmpit:latest
    build: .
    environment:
      - SWARMPIT_DB=http://db:5984
      - SWARMPIT_INFLUXDB=http://influxdb:8086
      - SWARMPIT_DOCKER_API=1.44
      # Optional shared secret for the agent's POST /events. Left empty the
      # endpoint stays open, which is what the stock agent needs. Set it to any
      # random string to require the agent to present it - the agent picks it up
      # from EVENT_ENDPOINT below, so both must match.
      - SWARMPIT_EVENT_TOKEN=${SWARMPIT_EVENT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 888:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
      placement:
        constraints:
          - node.role == manager

  db:
    image: couchdb:2.3.0
    volumes:
      - db-data:/opt/couchdb/data
    networks:
      - net
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 128M

  influxdb:
    image: influxdb:1.8
    volumes:
      - influx-data:/var/lib/influxdb
    networks:
      - net
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 512M
        reservations:
          cpus: '0.30'
          memory: 128M

  agent:
    image: swarmpit/agent:latest
    environment:
      - DOCKER_API_VERSION=1.44
      # The agent cannot send headers, but EVENT_ENDPOINT is a full URL, so the
      # shared secret travels as a query parameter. Harmless when unset.
      - EVENT_ENDPOINT=http://app:8080/events?token=${SWARMPIT_EVENT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - net
    deploy:
      mode: global
      labels:
        swarmpit.agent: 'true'
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M

networks:
  net:
    driver: overlay

volumes:
  db-data:
    driver: local
  influx-data:
    driver: local
