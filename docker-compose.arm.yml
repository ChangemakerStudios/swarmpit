services:
  app:
    image: ghcr.io/changemakerstudios/swarmpit:latest
    build: .
    environment:
      - SWARMPIT_DB=http://db:5984
      - SWARMPIT_INFLUXDB=http://influxdb:8086
      - SWARMPIT_DOCKER_API=1.44
      # Optional shared secret for the agent's POST /events. Left empty the
      # endpoint stays open, which is what an agent without a token needs. Set
      # it to any random string to require the agent to present it - the agent
      # below reads the same variable, so the two stay in sync.
      - SWARMPIT_EVENT_TOKEN=${SWARMPIT_EVENT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 888:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
      placement:
        constraints:
          - node.role == manager
  db:
    image: treehouses/couchdb:2.3.1
    volumes:
      - db-data:/opt/couchdb/data
    networks:
      - net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  influxdb:
    image: influxdb:1.7
    volumes:
      - influx-data:/var/lib/influxdb
    networks:
      - net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  agent:
    image: ghcr.io/changemakerstudios/agent:latest
    environment:
      - DOCKER_API_VERSION=1.44
      # Sent as the X-Swarmpit-Event-Token header. Must match the app's
      # SWARMPIT_EVENT_TOKEN. Ignored by both sides when empty.
      - SWARMPIT_EVENT_TOKEN=${SWARMPIT_EVENT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - net
    deploy:
      mode: global
      labels:
        swarmpit.agent: 'true'
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  net:
    driver: overlay

volumes:
  db-data:
    driver: local
  influx-data:
    driver: local
